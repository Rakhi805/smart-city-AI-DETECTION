<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI Smart City Dashboard</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><header><h1>AI-Powered Smart City Dashboard</h1><p>Problem Detection & Prediction System</p></header><main><section class="cards"><div><h3>Total Problems</h3><h2 id="totalProblems">--</h2></div><div><h3>Critical Issues</h3><h2 id="criticalProblems">--</h2></div><div><h3>AI Risk Score</h3><h2>72%</h2></div><div><h3>Sustainability</h3><h2>84%</h2></div></section><section class="panel"><h2>Live Problems</h2><button onclick="loadProblems()">Refresh</button><table><thead><tr><th>Type</th><th>Location</th><th>Severity</th><th>Status</th></tr></thead><tbody id="problemTable"></tbody></table></section><section class="panel"><h2>Citizen Report</h2><form id="reportForm"><input id="location" placeholder="Location" required><input id="problem_type" placeholder="Problem type" required><select id="priority"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select><textarea id="description" placeholder="Describe the problem" required></textarea><button>Submit Report</button></form></section></main><script src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
